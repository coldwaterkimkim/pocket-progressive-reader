name: PocketReader
options:
  bundleIdPrefix: com.coldwater
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
targets:
  PocketReader:
    type: application
    platform: iOS
    sources:
      - path: PocketReader
        excludes: [RichReader]
      - path: PocketReader/RichReader
        type: folder
        buildPhase: resources
    info:
      path: PocketReader/Info.plist
      properties:
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coldwater.pocketreader
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Pocket Reader
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
  PocketReaderTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PocketReaderTests]
    dependencies:
      - target: PocketReader
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  PocketReaderUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PocketReaderUITests]
    dependencies:
      - target: PocketReader
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PocketReader:
    build:
      targets:
        PocketReader: all
    test:
      targets: [PocketReaderTests, PocketReaderUITests]
